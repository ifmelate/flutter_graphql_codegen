name: flutter_graphql_codegen
description: A powerful code generator for Flutter GraphQL applications that generates type-safe Dart classes and client extensions from GraphQL schemas and operations.
version: 3.2.0
homepage: https://github.com/ifmelate/flutter_graphql_codegen
repository: https://github.com/ifmelate/flutter_graphql_codegen.git
issue_tracker: https://github.com/ifmelate/flutter_graphql_codegen/issues
documentation: https://github.com/ifmelate/flutter_graphql_codegen#readme

topics:
  - graphql
  - codegen
  - flutter
  - dart
  - type-safety

environment:
  sdk: ^3.4.0

# Add regular dependencies here.
dependencies:
  path: ^1.8.1
  args: ^2.4.0
  build: ">=2.4.0 <6.0.0"
  dart_style: ">=2.3.0 <4.0.0"
  pub_semver: ^2.1.0
  yaml: ^3.1.0
  http: ^1.1.2
  graphql: ^5.1.3
  glob: ^2.1.0
  gql: ^1.0.0
  crypto: ^3.0.3
  json_annotation: ^4.8.1

dev_dependencies:
  lints: ^4.0.0
  build_runner: ^2.4.6
  test: ^1.24.0
  json_serializable: ^6.7.1
  coverage: ^1.6.0
  build_test: ">=2.2.2 <4.0.0"
