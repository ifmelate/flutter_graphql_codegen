builders:
  graphql_codegen:
    import: "package:flutter_graphql_codegen/flutter_graphql_codegen.dart"
    builder_factories: ["graphqlCodegenBuilder"]
    build_extensions: {".graphql": [".g.dart"]}
    auto_apply: root_package
    build_to: source
    required_inputs: [".graphql", ".yaml"]
    defaults:
      options:
        config_path: graphql_codegen.yaml

targets:
  $default:
    builders:
      flutter_graphql_codegen|graphql_codegen:
        enabled: true
        generate_for:
          include:
            - lib/**
          exclude:
            - test/**